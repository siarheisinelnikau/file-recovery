[package]
name = "file-recovery"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Read-only NTFS and FAT file recovery with validated PNG carving for Windows"
repository = "https://github.com/siarheisinelnikau/file-recovery"
build = "build.rs"

[lib]
name = "file_recovery"

[[bin]]
name = "FileRecovery"
path = "src/main.rs"

[dependencies]
crc32fast = "=1.5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
semver = "1.0"
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_Ioctl", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Registry"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"


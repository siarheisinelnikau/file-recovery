name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked --all-targets --jobs 2
      - run: cargo clippy --locked --all-targets --jobs 2 -- -D warnings
      - run: node --test tools/publish-release.test.cjs
      - run: ./tools/package.ps1
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/verify_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: FileRecovery-windows-x64
          path: dist/*
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: file-recovery-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: FileRecovery-windows-x64
          path: dist
      - uses: actions/github-script@v8
        with:
          script: |
            const {publish} = require('./tools/publish-release.cjs');
            await publish({github, context, core});
